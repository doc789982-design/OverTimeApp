name: Сборка Windows

# Когда собирать:
#  1) при каждом пуше в main (готовая сборка появится во вкладке Actions)
#  2) при публикации тега вида v* (сборка станет официальным релизом)
#  3) вручную: вкладка Actions -> Сборка Windows -> Run workflow
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # чтобы публиковать релиз

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller pywin32 openpyxl pillow

      - name: Версия программы из AppTheme.qml
        id: ver
        shell: pwsh
        run: |
          $theme = Get-Content components/AppTheme.qml -Raw -Encoding UTF8
          if ($theme -match 'appVersion:\s*"([^"]+)"') {
            $v = $Matches[1]
          } else {
            $v = "dev"
          }
          $sha = "${{ github.sha }}".Substring(0, 7)
          "version=$v" >> $env:GITHUB_OUTPUT
          "zipname=OVERTIMETAB_$($v)_$($sha)" >> $env:GITHUB_OUTPUT
          Write-Host "Версия: $v"

      - name: Сгенерировать ресурсы (QML/иконки/шрифты внутрь exe)
        run: python tools/make_resources.py

      - name: Сгенерировать иконку .ico
        run: python tools/make_icon.py

      - name: Сборка PyInstaller (только нужные куски Qt)
        run: pyinstaller --noconfirm --clean tools/overtimetab.spec

      - name: Собрать ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\OVERTIMETAB\*" -DestinationPath "${{ steps.ver.outputs.zipname }}.zip"
          Get-Item "${{ steps.ver.outputs.zipname }}.zip" | Select-Object Name, @{N='МБ';E={[math]::Round($_.Length/1MB,1)}}

      - name: Загрузить сборку в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zipname }}
          path: ${{ steps.ver.outputs.zipname }}.zip
          retention-days: 30

      - name: Опубликовать релиз (если это тег)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.zipname }}.zip
          generate_release_notes: true
