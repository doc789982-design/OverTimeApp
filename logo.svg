<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Синий фон МВД -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a4494"/>
            <stop offset="100%" stop-color="#203473"/>
        </linearGradient>

        <!-- Светлое золото (Левая часть) -->
        <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f5df7a"/>
            <stop offset="100%" stop-color="#dcb948"/>
        </linearGradient>

        <!-- Темное золото (Правая часть) -->
        <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#d4aa38"/>
            <stop offset="100%" stop-color="#ae8322"/>
        </linearGradient>

        <!-- Краповый красный (Сердцевина щита) -->
        <linearGradient id="redCore" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d62d35"/>
            <stop offset="100%" stop-color="#ab1e24"/>
        </linearGradient>

        <clipPath id="appClip">
            <rect width="512" height="512" rx="112"/>
        </clipPath>

        <clipPath id="leftHalf">
            <rect x="0" y="0" width="256" height="512"/>
        </clipPath>

        <clipPath id="rightHalf">
            <rect x="256" y="0" width="256" height="512"/>
        </clipPath>
    </defs>

    <!-- 1. ФОН ПРИЛОЖЕНИЯ -->
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>

    <!-- 2. ДЛИННАЯ ТЕНЬ (Long Shadow) -->
    <g clip-path="url(#appClip)">
        <!-- Тень от рукояти меча -->
        <polygon points="256,40 512,296 512,512 256,512" fill="#182759" opacity="0.8"/>
        <!-- Тень от левого края щита -->
        <polygon points="100,200 412,512 256,512" fill="#182759" opacity="0.8"/>
    </g>

    <!-- 3. ПРАВАЯ ПОЛОВИНА: ШЕСТЕРЕНКА И ЧАСЫ -->
    <g clip-path="url(#rightHalf)">
        <!-- Зубья шестеренки -->
        <g fill="url(#goldDark)">
            <rect x="236" y="130" width="40" height="252" transform="rotate(0 256 256)"/>
            <rect x="236" y="130" width="40" height="252" transform="rotate(30 256 256)"/>
            <rect x="236" y="130" width="40" height="252" transform="rotate(60 256 256)"/>
            <rect x="236" y="130" width="40" height="252" transform="rotate(90 256 256)"/>
            <rect x="236" y="130" width="40" height="252" transform="rotate(120 256 256)"/>
            <rect x="236" y="130" width="40" height="252" transform="rotate(150 256 256)"/>
        </g>
        <!-- Основа шестеренки -->
        <circle cx="256" cy="256" r="108" fill="url(#goldDark)"/>
        <!-- Темно-синий обод -->
        <circle cx="256" cy="256" r="92" fill="#1f2e6a"/>
        <!-- Белый циферблат -->
        <circle cx="256" cy="256" r="84" fill="#fdfdfd"/>
        
        <!-- Засечки на часах -->
        <g stroke="#1f2e6a" stroke-width="8" stroke-linecap="round">
            <line x1="256" y1="184" x2="256" y2="196" />
            <line x1="256" y1="184" x2="256" y2="196" transform="rotate(30 256 256)"/>
            <line x1="256" y1="184" x2="256" y2="196" transform="rotate(60 256 256)"/>
            <line x1="256" y1="184" x2="256" y2="196" transform="rotate(90 256 256)"/>
            <line x1="256" y1="184" x2="256" y2="196" transform="rotate(120 256 256)"/>
            <line x1="256" y1="184" x2="256" y2="196" transform="rotate(150 256 256)"/>
            <line x1="256" y1="184" x2="256" y2="196" transform="rotate(180 256 256)"/>
        </g>
    </g>

    <!-- 4. ЛЕВАЯ ПОЛОВИНА: ГЕРАЛЬДИЧЕСКИЙ ЩИТ -->
    <g clip-path="url(#leftHalf)">
        <!-- Золотой внешний кант -->
        <path d="M 256 120 Q 150 130 110 170 C 110 280 150 360 256 420 Z" fill="url(#goldLight)"/>
        <!-- Темно-синяя прослойка -->
        <path d="M 256 142 Q 166 150 130 186 C 130 278 166 346 256 394 Z" fill="#1f2e6a"/>
        <!-- Краповый центр -->
        <path d="M 256 154 Q 178 162 144 196 C 144 274 178 334 256 376 Z" fill="url(#redCore)"/>
    </g>

    <!-- 5. ЦЕНТРАЛЬНАЯ ОСЬ: МЕЧ -->
    <!-- Лезвие -->
    <polygon points="256,174 234,174 256,460" fill="url(#goldLight)"/>
    <polygon points="256,174 278,174 256,460" fill="url(#goldDark)"/>
    
    <!-- Гарда (Крестовина) -->
    <path d="M 256 142 L 174 142 A 12 12 0 1 0 174 166 Q 220 166 256 174 Z" fill="url(#goldLight)"/>
    <path d="M 256 142 L 338 142 A 12 12 0 1 1 338 166 Q 292 166 256 174 Z" fill="url(#goldDark)"/>

    <!-- Рукоять -->
    <polygon points="256,142 244,142 248,72 256,72" fill="#e5e7eb"/>
    <polygon points="256,142 268,142 264,72 256,72" fill="#9ca3af"/>

    <!-- Диагональная оплетка на рукояти -->
    <g stroke="#374151" stroke-width="3" stroke-linecap="round">
        <line x1="247" y1="124" x2="265" y2="130"/>
        <line x1="247" y1="110" x2="265" y2="116"/>
        <line x1="247" y1="96"  x2="265" y2="102"/>
        <line x1="248" y1="82"  x2="264" y2="88"/>
    </g>

    <!-- Навершие (Яблоко меча) -->
    <path d="M 256 72 A 14 14 0 0 0 256 44 Z" fill="#e5e7eb"/>
    <path d="M 256 72 A 14 14 0 0 1 256 44 Z" fill="#9ca3af"/>
    <!-- Маленький шип наверху -->
    <polygon points="256,44 253,44 256,34 259,44" fill="#e5e7eb"/>

    <!-- 6. СТРЕЛКИ ЧАСОВ (Поверх меча) -->
    <g transform="translate(256, 256)">
        <!-- Минутная стрелка (На 12) -->
        <polygon points="-6,0 6,0 0,-50" fill="#1f2e6a"/>
        <!-- Часовая стрелка (На 2) -->
        <g transform="rotate(60)">
            <polygon points="-6,0 6,0 0,-36" fill="#1f2e6a"/>
        </g>
    </g>
    <!-- Центральная красная точка -->
    <circle cx="256" cy="256" r="8" fill="#d62d35"/>
</svg>