<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERTIMETAB · веб-срез</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <!-- ═══ ШАПКА ═══ -->
  <header class="titlebar">
    <div class="brand">
      <span class="logo">ОТ</span>
      <span class="brand-name">OVERTIMETAB</span>
      <span class="chip" title="Все числа считаются настоящим движком программы — logic.py и database.py">веб-срез · живые расчёты logic.py</span>
    </div>
    <div class="titlebar-right">
      <div class="seg" id="variantSeg" title="Как показывать мини-год в карточках">
        <button data-v="squares" class="on">Матрица</button>
        <button data-v="bars">Спарклайн</button>
        <button data-v="off">Скрыть</button>
      </div>
      <button class="icon-btn" id="themeBtn" title="Светлая / тёмная тема">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="body">

    <!-- ═══ РЕЙКА ГРУПП ═══ -->
    <nav class="groups" id="groupRail"></nav>

    <!-- ═══ СПИСОК СОТРУДНИКОВ ═══ -->
    <aside class="emplist">
      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" placeholder="Поиск…" autocomplete="off">
      </div>
      <div class="list" id="empList"></div>
    </aside>

    <!-- ═══ РАБОЧАЯ ОБЛАСТЬ ═══ -->
    <main class="workspace">
      <div class="tabs-row">
        <div class="year-wrap">
          <button class="year-btn" id="yearBtn"></button>
          <div class="menu" id="yearMenu"></div>
        </div>
        <div class="tabs" id="monthTabs"></div>
      </div>

      <div class="content">
        <section class="calendar-wrap" id="calendarWrap"></section>

        <!-- Инспектор дня: открывается кликом по ячейке -->
        <aside class="inspector" id="inspector"></aside>

        <!-- Плавающая кнопка «Сегодня» -->
        <button class="today-btn" id="todayBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Сегодня
        </button>

        <aside class="summary" id="summaryPanel"></aside>
      </div>
    </main>
  </div>
  <div class="toasts" id="toasts"></div>
</div>
<script src="app.js"></script>
</body>
</html>
